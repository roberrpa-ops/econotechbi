<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EconoTechBI - Sistema de Comanda Virtual</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-4 sm:p-8">

  <div class="max-w-5xl mx-auto space-y-8">
    
    <!-- Cabeçalho -->
    <div class="border-b border-slate-800 pb-4 flex justify-between items-center">
      <div>
        <h1 class="text-3xl font-extrabold text-cyan-400">EconoTechBI - Caixa & Salão</h1>
        <p class="text-slate-400 text-sm mt-1">Lançamento de Comandas e Integração com BI</p>
      </div>
      <a href="cardapio.html" class="text-xs bg-slate-800 hover:bg-slate-700 text-cyan-400 border border-slate-700 px-4 py-2 rounded-lg">Gerenciar Cardápio</a>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
      
      <!-- Formulário de Novo Pedido -->
      <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl">
        <h2 class="text-xl font-bold text-white mb-4">Novo Pedido / Mesa</h2>
        
        <form id="formPedido" class="space-y-4">
          <div>
            <label class="block text-xs font-semibold text-slate-300 mb-1">Número da Mesa *</label>
            <input type="number" id="mesaId" required placeholder="Ex: 5" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3.5 py-2 text-sm text-white focus:outline-none focus:border-cyan-500">
          </div>

          <div>
            <label class="block text-xs font-semibold text-slate-300 mb-1">Selecione o Produto *</label>
            <select id="selectProduto" required class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3.5 py-2 text-sm text-white focus:outline-none focus:border-cyan-500">
              <option value="">Carregando cardápio...</option>
            </select>
          </div>

          <div>
            <label class="block text-xs font-semibold text-slate-300 mb-1">Forma de Pagamento (para o Caixa) *</label>
            <select id="formaPagamento" required class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3.5 py-2 text-sm text-white focus:outline-none focus:border-cyan-500">
              <option value="PIX">PIX</option>
              <option value="Cartão de Crédito">Cartão de Crédito</option>
              <option value="Cartão de Débito">Cartão de Débito</option>
              <option value="Dinheiro">Dinheiro</option>
            </select>
          </div>

          <button type="submit" class="w-full bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold py-2.5 px-4 rounded-lg transition duration-200 text-sm">
            Lançar Pedido & Fechar Conta
          </button>
        </form>
        <div id="statusPedido" class="mt-3 text-sm hidden"></div>
      </div>

      <!-- Resumo e Pedidos Ativos -->
      <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl flex flex-col justify-between">
        <div>
          <h2 class="text-xl font-bold text-white mb-4">Fluxo de Caixa em Tempo Real</h2>
          <p class="text-slate-400 text-sm mb-4">Cada pedido lançado alimenta automaticamente as tabelas de inteligência e lucratividade da EconoTechBI.</p>
          
          <div class="bg-slate-800/50 border border-slate-700/50 rounded-xl p-4">
            <span class="text-xs text-slate-400 uppercase font-semibold">Total de Vendas Registradas</span>
            <div id="totalVendas" class="text-2xl font-extrabold text-emerald-400 mt-1">R$ 0,00</div>
          </div>
        </div>

        <div class="mt-6">
          <button onclick="carregarDadosCaixa()" class="w-full bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-semibold py-2 rounded-lg border border-slate-700">
            Atualizar Dados do Caixa
          </button>
        </div>
      </div>

    </div>

  </div>

  <script>
    // Configurações do Supabase (Mesmas chaves do seu projeto)
    const SUPABASE_URL = "https://ubtgyzcdvumfxgujpshz.supabase.co"; 
    const SUPABASE_ANON_KEY = "sb_publishable_eH09_dM0w0DreGw8JOx7mg_P1w3rZGC"; // Substitua pela sua publishable key real
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // Carregar produtos no select
    async function carregarCardapioSelect() {
      const select = document.getElementById('selectProduto');
      const { data, error } = await supabaseClient.from('produtos').select('*');
      
      if (error || !data || data.length === 0) {
        select.innerHTML = `<option value="">Cadastre produtos no cardápio primeiro</option>`;
        return;
      }

      select.innerHTML = `<option value="">Selecione um item...</option>` + data.map(p => `
        <option value="${p.id}" data-preco="${p.preco_venda}">${p.nome} - R$ ${parseFloat(p.preco_venda).toFixed(2)}</option>
      `).join('');
    }

    // Registrar Pedido e Transação Financeira
    document.getElementById('formPedido').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const mesa_id = parseInt(document.getElementById('mesaId').value);
      const selectProd = document.getElementById('selectProduto');
      const produtoId = selectProd.value;
      const produtoNome = selectProd.options[selectProd.selectedIndex].text;
      const precoVenda = parseFloat(selectProd.options[selectProd.selectedIndex].getAttribute('data-preco'));
      const forma_pagamento = document.getElementById('formaPagamento').value;
      const statusDiv = document.getElementById('statusPedido');

      if (!produtoId) {
        alert('Selecione um produto.');
        return;
      }

      statusDiv.className = "mt-3 text-sm text-cyan-400";
      statusDiv.textContent = "Processando pedido...";
      statusDiv.classList.remove('hidden');

      // 1. Inserir na tabela pedidos
      const { error: erroPedido } = await supabaseClient.from('pedidos').insert([{
        mesa_id: mesa_id,
        itens_pedido: produtoNome,
        status_pedido: 'Entregue / Pago',
        valor_total: precoVenda
      }]);

      // 2. Inserir na tabela transacoes_financeiras (Alimenta o BI)
      const { error: erroTransacao } = await supabaseClient.from('transacoes_financeiras').insert([{
        valor_recebido: precoVenda,
        forma_pagamento: forma_pagamento,
        data_hora: new Date().toISOString()
      }]);

      if (erroPedido || erroTransacao) {
        statusDiv.className = "mt-3 text-sm text-red-400";
        statusDiv.textContent = "Erro ao registrar pedido.";
      } else {
        statusDiv.className = "mt-3 text-sm text-emerald-400";
        statusDiv.textContent = "Pedido lançado e caixa atualizado com sucesso!";
        document.getElementById('formPedido').reset();
        carregarDadosCaixa();
      }
    });

    // Carregar total de vendas para simular o BI
    async function carregarDadosCaixa() {
      const { data, error } = await supabaseClient.from('transacoes_financeiras').select('valor_recebido');
      if (!error && data) {
        const total = data.reduce((acc, curr) => acc + parseFloat(curr.valor_recebido || 0), 0);
        document.getElementById('totalVendas').textContent = `R$ ${total.toFixed(2)}`;
      }
    }

    window.onload = () => {
      carregarCardapioSelect();
      carregarDadosCaixa();
    };
  </script>
</body>
</html>
